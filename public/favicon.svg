<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Rich Imperial Jade -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244B3A" />
      <stop offset="100%" stop-color="#162E24" />
    </linearGradient>

    <!-- Golden Stamen Gradient -->
    <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D897" />
      <stop offset="70%" stop-color="#C59B4B" />
      <stop offset="100%" stop-color="#9E762E" />
    </radialGradient>

    <!-- Petal Subtle Shade -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
  </defs>

  <!-- Oriental Seal Rounded Square Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#jadeGrad)" stroke="#C59B4B" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner Celadon Ring Accent -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#FAF7F2" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.3" />

  <!-- Botanical Jasmine Flower (5 Petals radiating at 72° angles) -->
  <g transform="translate(32, 32)">
    <!-- Petal 1 (0 deg - top) -->
    <path d="M 0 0 C -7 -10, -8 -21, 0 -24 C 8 -21, 7 -10, 0 0 Z" fill="url(#petalGrad)" stroke="#E8E2D5" stroke-width="0.75" />
    <!-- Petal 2 (72 deg) -->
    <path d="M 0 0 C -7 -10, -8 -21, 0 -24 C 8 -21, 7 -10, 0 0 Z" fill="url(#petalGrad)" stroke="#E8E2D5" stroke-width="0.75" transform="rotate(72)" />
    <!-- Petal 3 (144 deg) -->
    <path d="M 0 0 C -7 -10, -8 -21, 0 -24 C 8 -21, 7 -10, 0 0 Z" fill="url(#petalGrad)" stroke="#E8E2D5" stroke-width="0.75" transform="rotate(144)" />
    <!-- Petal 4 (216 deg) -->
    <path d="M 0 0 C -7 -10, -8 -21, 0 -24 C 8 -21, 7 -10, 0 0 Z" fill="url(#petalGrad)" stroke="#E8E2D5" stroke-width="0.75" transform="rotate(216)" />
    <!-- Petal 5 (288 deg) -->
    <path d="M 0 0 C -7 -10, -8 -21, 0 -24 C 8 -21, 7 -10, 0 0 Z" fill="url(#petalGrad)" stroke="#E8E2D5" stroke-width="0.75" transform="rotate(288)" />

    <!-- Inner Blossom Petal Whispers (Subtle Second Layer) -->
    <path d="M 0 0 C -4 -6, -4 -13, 0 -15 C 4 -13, 4 -6, 0 0 Z" fill="#FFFFFF" opacity="0.85" transform="rotate(36)" />
    <path d="M 0 0 C -4 -6, -4 -13, 0 -15 C 4 -13, 4 -6, 0 0 Z" fill="#FFFFFF" opacity="0.85" transform="rotate(108)" />
    <path d="M 0 0 C -4 -6, -4 -13, 0 -15 C 4 -13, 4 -6, 0 0 Z" fill="#FFFFFF" opacity="0.85" transform="rotate(180)" />
    <path d="M 0 0 C -4 -6, -4 -13, 0 -15 C 4 -13, 4 -6, 0 0 Z" fill="#FFFFFF" opacity="0.85" transform="rotate(252)" />
    <path d="M 0 0 C -4 -6, -4 -13, 0 -15 C 4 -13, 4 -6, 0 0 Z" fill="#FFFFFF" opacity="0.85" transform="rotate(324)" />

    <!-- Golden Pistil Center -->
    <circle cx="0" cy="0" r="4.2" fill="url(#goldCore)" stroke="#FFFFFF" stroke-width="0.8" />
    
    <!-- Fine Golden Anther Dots -->
    <circle cx="0" cy="-2.4" r="0.8" fill="#FFF7DE" />
    <circle cx="2.3" cy="-0.8" r="0.8" fill="#FFF7DE" />
    <circle cx="1.4" cy="2" r="0.8" fill="#FFF7DE" />
    <circle cx="-1.4" cy="2" r="0.8" fill="#FFF7DE" />
    <circle cx="-2.3" cy="-0.8" r="0.8" fill="#FFF7DE" />
  </g>
</svg>
